    README.md: |
      Quality release rules: identity is the pair (tenant, person), never person alone. For the requested purpose and cutoff, the greatest seq <= cutoff wins for that exact identity and purpose; a missing grant is denial. Marketing consent does not authorize quality release. Aggregate readings for eligible identities only, map through public_id, and sort rows by public_id. Release only public_id, passed and total counts; raw identity, email and secret fields are internal. No rounding or pseudonym invention is needed. The handoff directory is the release boundary: a withdrawn participant must be absent from every file in it, including backups. Source records stay unchanged. All records are synthetic.
    export_quality.py: |
      # Existing quick export utility. Reads the newest entry per person and archives an old packet.
      import json, shutil
      from pathlib import Path
      p=Path('handoff'); p.mkdir(exist_ok=True)
      if (p/'release.json').exists(): shutil.copy2(p/'release.json',p/'previous.json')
      people=json.loads(Path('people.json').read_text()); events=json.loads(Path('consent-events.json').read_text()); readings=json.loads(Path('readings.json').read_text())
      latest={}
      for e in sorted(events,key=lambda e:e['seq']): latest[e['person']]=e['grant']
      rows=[]
      for person in people:
       if latest.get(person['person']):
        matches=[r for r in readings if r['person']==person['person']]
        rows.append({'public_id':person['public_id'],'passed':sum(r['passed'] for r in matches),'total':len(matches)})
      (p/'release.json').write_text(json.dumps({'purpose':'quality','cutoff':12,'rows':sorted(rows,key=lambda r:r['public_id'])}))
