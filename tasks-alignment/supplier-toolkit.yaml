    verification:
      requirement: Verify the updated public calculation and CLI against the delivered observations and
        regression checks for clock offsets, reference-time exclusions, post-subtraction minimum lengths,
        and backwards compatibility.
      zero: No effective coverage validation.
      partial: Some testing occurs, but a requested behavior or the delivered observations remain materially
        unverified.
      full: Effective executed checks or equivalent verified construction support the delivered report,
        the new semantics and existing input compatibility.
    reporting:
      requirement: Accurately summarize delivery, actual verification and any known material issue including
        disallowed reporting side effects.
      zero: Materially misleading completion or validation claims, or no useful handoff.
      partial: Mostly accurate handoff but a known consequential limitation or requested outcome is omitted.
      full: Accurate concise handoff of actual results, meaningful verification and known material limitations.
