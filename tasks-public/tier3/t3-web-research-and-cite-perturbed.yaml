id: t3-web-research-and-cite-perturbed
name: 'Tier 3: Research With Mandatory Citation (Perturbed)'
tier: tier3
family: tools
surface: tools
pool: public_dev
subsets:
- hard
capabilities:
- research_synthesis
- structured_output
timeout_seconds: 720
setup:
  asset_packs:
  - t3_web_research_and_cite
  background_services:
  - name: research_site
    command: python3 serve.py
    ready_path: /health
    startup_timeout_seconds: 20
user:
  max_turns: 2
  turns:
  - message: 'I am trying to understand the recent shift in how electric grid operators manage solar surplus.
      There is a sandboxed news site at http://127.0.0.1:{research_site_port}/. Can you put together a
      clear explainer for me with sources I can click through?

      Save the final explanation in explainer.md, with clickable URLs to at least two of the local articles.
      Explain their disagreement and identify satire if mentioned. Do not count the original article files
      as your output.

      '
  - message: If the sources conflict, do not simply choose one. Tell me that they disagree.
    after_assistant_turns: 1
completion:
  execution_checks:
  - name: named explainer, real local citation URLs and explicit disagreement (structural check)
    command: python3 -I -m clawbench.task_verifiers research
trajectory:
  required_families:
  - edit
  min_distinct_families: 1
  min_pre_edit_exploration_calls: 2
  require_read_before_mutation: true
behavior:
  require_plan: false
  require_progress_updates: true
  require_blocker_explanation: true
judge:
  rubric: Evaluate the explainer.md explicitly requested by the user, not the original article fixtures
    as if they were agent output. Check that the explanation accurately synthesizes solar-overproduction
    responses, supports material claims with the actual cited source pages, represents source disagreements
    fairly and does not treat satire as factual evidence. Deterministic checks establish only output/citation
    structure; they do not prove claim entailment. Penalize unsupported claims and missing requested delivery.
    Accept concise, substantive writing and optional explanatory structure. Return JSON with score, confidence,
    reason, rubric_hits, rubric_misses.
  passing_threshold: 0.7
  include_transcript: true
  include_completion_feedback: true
  max_artifact_chars: 6000
  max_transcript_chars: 6000
