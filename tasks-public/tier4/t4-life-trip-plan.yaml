id: t4-life-trip-plan
name: 'Tier 4: Trip Plan With Constraints'
tier: tier4
family: tools
surface: tools
pool: public_dev
subsets:
- hard
capabilities:
- research_synthesis
- structured_output
- multifile_reasoning
timeout_seconds: 960
setup:
  asset_packs:
  - t4_life_trip_plan
user:
  max_turns: 3
  turns:
  - message: 'I''m planning a long weekend in Kyoto next month and I need help

      putting together an actual itinerary. My profile is in the usual

      place. Try to keep it realistic — I don''t bounce back from packed

      days like I used to.


      Save your final plan in itinerary.json. Use {"days":[{"day":1,"visits":[{"venue_id":"catalog_id"}]}],"other_costs":[{"label":"local
      transport","estimate_usd":number}],"total_usd":number} with days 1, 2, and 3 exactly once and at
      least one visit each day. Schedule only venues from places.json; if you include a name, use its
      matching catalog name. Include vegetarian food. For any venue not marked mobility_friendly, add
      a mobility_note describing the limitation and a restricted visit or explicit requested relaxation.
      Each listed visit adds its catalog cost_usd once; the lodging catalog price covers the stated three-night
      booking, so list that booking only once if used. Label additional cost estimates separately, sum
      all visits and estimates accurately, and stay within the profile''s $800 cap. Preserve places.json.
      Free-form final prose can explain tradeoffs; the structured itinerary is the checked deliverable.

      '
  - message: Make sure we hit Fushimi Inari at some point even if it's a stretch — I've wanted to see
      it forever.
    after_assistant_turns: 1
  - message: If anything I'm asking for doesn't actually fit in the budget or my mobility, just tell me
      up front, don't try to fudge it.
    after_assistant_turns: 2
completion:
  execution_checks:
  - name: every scheduled venue exists in the original catalog
    command: python3 -I -m clawbench.task_verifiers trip venues
  - name: Fushimi Inari is an actual scheduled visit
    command: python3 -I -m clawbench.task_verifiers trip landmark
  - name: vegetarian food, explicit mobility limits and accurate budget
    command: python3 -I -m clawbench.task_verifiers trip constraints
trajectory:
  required_families:
  - read
  - edit
  min_distinct_families: 2
  min_pre_edit_exploration_calls: 4
  require_read_before_mutation: true
  require_self_verification: true
behavior:
  require_plan: true
  require_progress_updates: true
  require_blocker_explanation: true
judge:
  rubric: Evaluate the requested itinerary.json and the final explanation against the original profile
    and venue catalog. Check a usable three-day plan, vegetarian food, feasible pacing, truthful costs
    and realistic handling of limited mobility. The Fushimi Inari full hike is incompatible with the profile;
    a clearly restricted lower-area visit can be appropriate. A mobility_note merely existing is not proof
    that its adaptation is adequate. Deterministic checks establish catalog IDs, basic constraints and
    sums, not complete real-world feasibility. Do not treat original profile/places files as agent output.
    Accept extra explanatory fields and day ordering when the required schedule is equivalent. Return
    JSON with score, confidence, reason, rubric_hits, rubric_misses.
  passing_threshold: 0.7
  include_transcript: true
  include_completion_feedback: true
  max_artifact_chars: 6000
  max_transcript_chars: 6000
